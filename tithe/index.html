<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-bs-core="default">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' https://cdn.jsdelivr.net; script-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    >
    <title>Tithe | Bitspire Studio</title>
    <meta name="description" content="Tithe is a retro dark fantasy co-op game from Bitspire Studio.">
    <link rel="icon" href="/assets/brand/bitspire-logo-light.png">
    <link
      href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css"
      rel="stylesheet"
      integrity="sha256-RjeFzczeuZHCyS+Gvz+kleETzBF/o84ZRHukze/yv6o="
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="/assets/css/site.css">
    <link rel="stylesheet" href="/assets/css/tithe.css">
    <script type="module" src="/assets/js/site.js"></script>
    <script type="module" src="/assets/js/tithe.js"></script>
  </head>
  <body class="tithe-page min-vh-100 d-flex flex-column">
    <nav class="studio-nav tithe-nav" aria-label="Main navigation">
      <div class="container-xl studio-nav__inner">
        <a class="brand-switch brand-switch--nav" href="/" aria-label="Bitspire Studio home">
          <img class="brand-switch__light" src="/assets/brand/bitspire-logo-light.png" alt="Bitspire Studio">
          <img class="brand-switch__dark" src="/assets/brand/bitspire-logo-dark.png" alt="">
        </a>

        <div class="studio-nav__links">
          <a class="studio-nav__link" href="/">Studio</a>
          <a class="studio-nav__link is-active" href="/tithe/" aria-current="page">Tithe</a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">
      <header class="tithe-hero">
        <div class="tithe-dither" aria-hidden="true"></div>
        <div class="container-xl tithe-hero__inner">
          <h1 class="tithe-title">
            <img class="tithe-wordmark" src="/assets/steam/library-logo-transparent.png" width="1280" height="720" alt="Tithe">
          </h1>
          <div class="tithe-status-line">
            <span class="tithe-status">In development</span>
            <a class="btn tithe-button" data-tithe-steam-link hidden>Tithe on Steam</a>
          </div>
        </div>
      </header>

      <section class="tithe-gallery" aria-labelledby="tithe-gallery-title">
        <div class="container-xl">
          <div class="tithe-gallery__heading">
            <h2 class="tithe-heading" id="tithe-gallery-title">Gallery</h2>
          </div>

          <div class="tithe-gallery-container" id="tithe-gallery">
            <div class="tithe-gallery-stage" tabindex="0" role="region" aria-label="Tithe gallery viewer">
              <div class="tithe-gallery-main">
                <img
                  id="tithe-gallery-active-img"
                  class="tithe-gallery-main__img"
                  src="/assets/screenshots/rootmar-sunrise.png"
                  alt="Sunrise in Rootmar"
                >
                <div class="tithe-gallery-vignette" aria-hidden="true"></div>
              </div>

              <button
                class="tithe-gallery-arrow tithe-gallery-arrow--prev"
                type="button"
                aria-label="Previous gallery item"
                data-gallery-prev
              >
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              <button
                class="tithe-gallery-arrow tithe-gallery-arrow--next"
                type="button"
                aria-label="Next gallery item"
                data-gallery-next
              >
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>

              <div class="tithe-gallery-stage__footer">
                <span class="tithe-gallery-counter" data-gallery-counter>1 / 20</span>
                <button
                  class="tithe-gallery-fullscreen-btn"
                  type="button"
                  aria-label="Toggle gallery fullscreen"
                  data-gallery-fullscreen
                  title="Toggle fullscreen"
                >
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="tithe-gallery-thumbs-wrapper">
              <div class="tithe-gallery-thumbs-strip" data-gallery-strip role="tablist" aria-label="Gallery items">
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="0"
                  data-youtube-video-id=""
                  aria-selected="true"
                >
                  <img src="/assets/screenshots/rootmar-sunrise.png" alt="Sunrise in Rootmar" loading="lazy" decoding="async">
                  <span class="tithe-thumb-item__play" aria-hidden="true">
                    <svg viewBox="0 0 12 12" width="12" height="12" fill="currentColor">
                      <polygon points="3,1 11,6 3,11"></polygon>
                    </svg>
                  </span>
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="1"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/citadel-companion.png" alt="Companion in the Citadel" loading="lazy" decoding="async">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="2"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/citadel-guard-1.png" alt="Citadel guard, first view" loading="lazy" decoding="async">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="3"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/citadel-guard-2.png" alt="Citadel guard, second view" loading="lazy" decoding="async">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="4"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/rootmar-companion.png" alt="Companion in Rootmar" loading="lazy" decoding="async">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="5"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/rootmar-rain.png" alt="Rain in Rootmar" loading="lazy" decoding="async">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="6"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/rootmar-skeleton.png" alt="Skeleton in Rootmar" loading="lazy" decoding="async">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="7"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/gameplay-1.jpg" alt="Tithe gameplay screenshot" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="8"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/gameplay-2.jpg" alt="Tithe gameplay screenshot 2" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="9"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/gameplay-3.jpg" alt="Tithe gameplay screenshot 3" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="10"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/gameplay-4.jpg" alt="Tithe gameplay screenshot 4" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="11"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/rain.jpg" alt="Rain in Tithe" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="12"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/storm.jpg" alt="Storm in Tithe" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="13"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/snow-sunrise.jpg" alt="Snowy sunrise in Tithe" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="14"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/snowstorm.jpg" alt="Snowstorm in Tithe" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="15"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/snow-displacement.jpg" alt="Snow detail in Tithe" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="16"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/outside-sunrise.jpg" alt="Sunrise outdoors in Tithe" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="17"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/cave-crystal.jpg" alt="Crystals in a Tithe cave" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="18"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/cave-exploring.jpg" alt="Exploring a cave in Tithe" loading="lazy">
                </button>
                <button
                  type="button"
                  role="tab"
                  class="tithe-thumb-item"
                  data-gallery-thumb="19"
                  aria-selected="false"
                >
                  <img src="/assets/screenshots/cave-monster.jpg" alt="Monster in a Tithe cave" loading="lazy">
                </button>
              </div>

              <div class="tithe-gallery-slider-bar">
                <button
                  class="tithe-slider-nav-btn tithe-slider-nav-btn--left"
                  type="button"
                  aria-label="Scroll thumbnails left"
                  data-strip-left
                >
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
                    <polygon points="15,4 7,12 15,20"></polygon>
                  </svg>
                </button>
                <div class="tithe-slider-track" data-strip-track aria-label="Thumbnail scroll position">
                  <div class="tithe-slider-handle" data-strip-handle></div>
                </div>
                <button
                  class="tithe-slider-nav-btn tithe-slider-nav-btn--right"
                  type="button"
                  aria-label="Scroll thumbnails right"
                  data-strip-right
                >
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
                    <polygon points="9,4 17,12 9,20"></polygon>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="tithe-footer">
      <div class="container-xl tithe-footer__inner">
        <a href="/">Bitspire Studio</a>
        <nav class="tithe-footer__links" aria-label="Tithe legal pages">
          <span>Tithe is in development.</span>
          <a href="/tithe/terms/">Terms of Service</a>
          <a href="/tithe/privacy/">Privacy Policy</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
